# USBuddy catalog seed file.
#
# Curated list of models that ship in the official catalog. Run:
#
#     cargo run -p xtask -- catalog-fetch
#
# This fetches each entry's HuggingFace LFS pointer (no model bytes
# downloaded) to capture the upstream sha256 + size, then writes the
# fully-populated catalog to fixtures/catalog/official.catalog.json.
#
# License notes:
#   - Each entry's license.sha256 is auto-computed from the body of
#     license.url. To pin a known hash instead, add `sha256 = "..."`
#     inside the `license = { ... }` table.
#   - Gated models (Llama family) need HF_TOKEN set when running xtask.

[catalog]
runtime_min = "0.1.0"
runtime_max = "0.1.99"
source = "repository"

# ---------------------------------------------------------------------
# Aligned (default instruct + safety training).
# ---------------------------------------------------------------------

[[models]]
id = "qwen2.5-7b-instruct-q4_k_m"
family_id = "qwen2.5-7b-instruct"
display_name = "Qwen 2.5 7B Instruct Q4_K_M"
version = "1"
hf_repo = "bartowski/Qwen2.5-7B-Instruct-GGUF"
hf_path = "Qwen2.5-7B-Instruct-Q4_K_M.gguf"
prompt_template = "chatml"
capabilities = ["chat", "function_calling", "json_mode", "long_context"]
aliases = ["qwen25-7b-q4"]
profile = "aligned"
license = { spdx = "Apache-2.0", title = "Apache License 2.0", url = "https://www.apache.org/licenses/LICENSE-2.0.txt", requires_attribution = false }

