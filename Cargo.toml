[workspace]
members = [
  "crates/usbuddy-core",
  "crates/usbuddy-installer-cli",
  "crates/usbuddy-installer-gui",
  "crates/usbuddy-installer-tui",
  "crates/usbuddy-runtime",
  "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
authors = ["Joe Peterson <opensource@skullzarmy.dev>"]
repository = "https://github.com/skullzarmy/USBuddy"

[workspace.dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["json"] }
clap = { version = "4.6.1", features = ["derive"] }
flate2 = "1.0.34"
reqwest = { version = "0.12.20", features = ["blocking", "stream", "json"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
sysinfo = "0.39.3"
tar = "0.4.43"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "net"] }
toml = "1.1.2"
walkdir = "2.5.0"
zip = { version = "2.2.1", default-features = false, features = ["deflate"] }
