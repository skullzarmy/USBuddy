# Cross-rs configuration. Used by the release workflow for non-host targets
# (currently linux-arm64). The default cross images don't ship the GTK /
# libxdo / appindicator development packages required by the `tray-icon`
# crate that the runtime depends on, so we install them as pre-build steps.

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install --assume-yes --no-install-recommends \
        libssl-dev:$CROSS_DEB_ARCH \
        libgtk-3-dev:$CROSS_DEB_ARCH \
        libxdo-dev:$CROSS_DEB_ARCH \
        libayatana-appindicator3-dev:$CROSS_DEB_ARCH \
        pkg-config",
]

[target.aarch64-unknown-linux-gnu.env]
passthrough = [
    "PKG_CONFIG_ALLOW_CROSS=1",
]
