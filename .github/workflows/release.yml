name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver version to release
        required: true
        type: string
      draft:
        description: Create a draft release
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix ui/web test
      - run: cargo test --workspace

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: usbuddy-installer-windows-x64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: usbuddy-installer-linux-x64.tar.gz
          - os: macos-latest
            target: universal2-apple-darwin
            archive: usbuddy-installer-macos-universal.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix ui/web build
      - name: Build workspace
        env:
          USBUDDY_VERSION: ${{ inputs.version }}
        run: cargo build --release --workspace
      - name: Package asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/${{ matrix.target }}
          cp -R ui/web/dist dist/${{ matrix.target }}/ui
          cp README.md NOTICE LICENSE dist/${{ matrix.target }}/
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp target/release/usbuddy-installer-cli.exe dist/${{ matrix.target }}/
            powershell -Command "Compress-Archive -Path dist/${{ matrix.target }}\* -DestinationPath ${{ matrix.archive }}"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            cp target/release/usbuddy-installer-cli dist/${{ matrix.target }}/
            tar -czf ${{ matrix.archive }} -C dist/${{ matrix.target }} .
          else
            cp target/release/usbuddy-installer-cli dist/${{ matrix.target }}/
            tar -czf ${{ matrix.archive }} -C dist/${{ matrix.target }} .
          fi
      - name: Checksum asset
        shell: bash
        run: sha256sum ${{ matrix.archive }} > ${{ matrix.archive }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-cyclonedx --locked
      - run: cargo cyclonedx --workspace --all --output-file SBOM.cdx.json
      - shell: bash
        run: |
          find artifacts -type f -maxdepth 2 | sort | xargs sha256sum > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            artifacts
            SBOM.cdx.json
            SHA256SUMS.txt

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release
      - name: Create tag
        run: |
          git tag v${{ inputs.version }}
          git push origin v${{ inputs.version }}
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ contains(inputs.version, '-') }}
          generate_release_notes: true
          files: |
            release/**
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: release/**
