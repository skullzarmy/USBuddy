name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver version to release
        required: true
        type: string
      draft:
        description: Create a draft release
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix ui/web test
      - run: cargo test --workspace

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            runtime_asset: usbuddy-runtime-macos-arm64
            archive: usbuddy-macos-arm64.tar.gz
            build_full: true
            setup: native
          - os: macos-latest
            target: x86_64-apple-darwin
            runtime_asset: usbuddy-runtime-macos-x64
            archive: usbuddy-macos-x64.tar.gz
            build_full: true
            setup: native
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            runtime_asset: usbuddy-runtime-linux-x64
            archive: usbuddy-linux-x64.tar.gz
            build_full: true
            setup: native
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            runtime_asset: usbuddy-runtime-linux-arm64
            archive: ""
            build_full: false
            setup: cross
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            runtime_asset: usbuddy-runtime-windows-x64.exe
            archive: usbuddy-windows-x64.zip
            build_full: true
            setup: native
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            runtime_asset: usbuddy-runtime-windows-arm64.exe
            archive: ""
            build_full: false
            setup: rustup-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux GUI deps
        if: runner.os == 'Linux' && matrix.build_full
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libssl-dev pkg-config
      - name: Install cross (linux-arm64 only)
        if: matrix.setup == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: actions/setup-node@v4
        if: matrix.build_full
        with:
          node-version: 22
      - run: npm --prefix ui/web build
        if: matrix.build_full
      - name: Build workspace (host-native)
        if: matrix.build_full
        env:
          USBUDDY_VERSION: ${{ inputs.version }}
        run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Build runtime only (cross via cross-rs)
        if: matrix.setup == 'cross'
        env:
          USBUDDY_VERSION: ${{ inputs.version }}
        run: cross build --release -p usbuddy-runtime --target ${{ matrix.target }}
      - name: Build runtime only (cross via rustup target)
        if: matrix.setup == 'rustup-target'
        env:
          USBUDDY_VERSION: ${{ inputs.version }}
        run: cargo build --release -p usbuddy-runtime --target ${{ matrix.target }}
      - name: Stage per-platform runtime asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            src="target/${{ matrix.target }}/release/usbuddy-runtime.exe"
          else
            src="target/${{ matrix.target }}/release/usbuddy-runtime"
          fi
          cp "$src" "dist/${{ matrix.runtime_asset }}"
          ( cd dist && sha256sum "${{ matrix.runtime_asset }}" > "${{ matrix.runtime_asset }}.sha256" )
      - name: Package full archive (host-native targets only)
        if: matrix.build_full
        shell: bash
        run: |
          set -euo pipefail
          stage="dist/${{ matrix.target }}"
          mkdir -p "$stage/bin"
          cp -R ui/web/dist "$stage/ui"
          cp README.md NOTICE LICENSE "$stage/"
          cp fixtures/catalog/official.catalog.json "$stage/catalog.json"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            for bin in usbuddy-installer-cli usbuddy-installer-tui usbuddy-installer-gui usbuddy-runtime; do
              cp "target/${{ matrix.target }}/release/${bin}.exe" "$stage/bin/"
            done
            cp launch-windows.bat "$stage/"
            powershell -Command "Compress-Archive -Path $stage\* -DestinationPath dist/${{ matrix.archive }}"
          else
            for bin in usbuddy-installer-cli usbuddy-installer-tui usbuddy-installer-gui usbuddy-runtime; do
              cp "target/${{ matrix.target }}/release/${bin}" "$stage/bin/"
            done
            if [[ "${{ runner.os }}" == "macOS" ]]; then
              cp launch-macos.command "$stage/"
            else
              cp launch-linux.sh "$stage/"
            fi
            tar -czf "dist/${{ matrix.archive }}" -C "$stage" .
          fi
          ( cd dist && sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256" )
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/${{ matrix.runtime_asset }}
            dist/${{ matrix.runtime_asset }}.sha256
            dist/${{ matrix.archive }}
            dist/${{ matrix.archive }}.sha256
          if-no-files-found: ignore

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-cyclonedx --locked
      - run: cargo cyclonedx --workspace --all --output-file SBOM.cdx.json
      - shell: bash
        run: |
          find artifacts -type f -maxdepth 2 | sort | xargs sha256sum > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            artifacts
            SBOM.cdx.json
            SHA256SUMS.txt

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release
      - name: Create tag
        run: |
          git tag v${{ inputs.version }}
          git push origin v${{ inputs.version }}
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ contains(inputs.version, '-') }}
          generate_release_notes: true
          files: |
            release/**
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: release/**
